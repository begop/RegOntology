[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regontology-backend"
version = "0.1.0"
description = "Mock-first regulation knowledge graph and grounded QA API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "neo4j==5.28.2",
  "pgvector==0.4.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "SQLAlchemy==2.0.43",
  "starlette==1.6.0",
  "uvicorn[standard]==0.35.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
