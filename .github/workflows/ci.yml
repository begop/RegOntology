name: CI and container release

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Lint
        run: ruff check backend/app backend/tests

      - name: Type check
        run: mypy --config-file backend/pyproject.toml backend/app

      - name: Unit and contract tests
        run: pytest -c backend/pyproject.toml backend/tests

      - name: Validate mock data syntax
        shell: python
        run: |
          import json
          from pathlib import Path

          json.loads(Path("mock-data/ontology/ontology_seed.json").read_text(encoding="utf-8"))
          for line_number, line in enumerate(
              Path("mock-data/evaluation/qa_gold.jsonl").read_text(encoding="utf-8").splitlines(),
              start=1,
          ):
              if line.strip():
                  try:
                      json.loads(line)
                  except json.JSONDecodeError as error:
                      raise SystemExit(f"Invalid JSONL at line {line_number}: {error}") from error

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Component tests
        run: pnpm test

      - name: Container production build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_DEMO_MODE: "false"
        run: pnpm build

      - name: GitHub Pages mock build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_BASE_PATH: /RegOntology/
          VITE_DEMO_MODE: "true"
          VITE_PAGES_BUILD: "true"
        run: pnpm build:pages

  repository-security:
    name: Secret and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  container-security:
    name: Container scan (${{ matrix.component }})
    needs:
      - backend-quality
      - frontend-quality
      - repository-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: deploy/docker/backend.Dockerfile
            image: regontology-api
          - component: web
            dockerfile: deploy/docker/frontend.Dockerfile
            image: regontology-web
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build runtime image for scanning
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          load: true
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            VITE_API_BASE_URL=/api/v1
            VITE_DEMO_MODE=false
          cache-from: type=gha,scope=scan-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.component }}

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: local/${{ matrix.image }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

  compose-smoke:
    name: Docker Compose smoke test
    needs:
      - backend-quality
      - frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Prepare isolated CI environment
        shell: bash
        run: |
          cp .env.example .env.ci
          sed -i 's/CHANGE_ME_POSTGRES_PASSWORD/ci-postgres-only/g' .env.ci
          sed -i 's/CHANGE_ME_NEO4J_PASSWORD/ci-neo4j-only/g' .env.ci
          sed -i 's/CHANGE_ME_REDIS_PASSWORD/ci-redis-only/g' .env.ci

      - name: Validate Compose configuration
        shell: python
        run: |
          import json
          import subprocess

          command = [
              "docker",
              "compose",
              "--env-file",
              ".env.ci",
              "config",
              "--format",
              "json",
          ]
          result = subprocess.run(command, capture_output=True, text=True, check=False)
          if result.returncode:
              print(result.stderr)
              raise SystemExit(result.returncode)

          services = json.loads(result.stdout)["services"]
          neo4j_environment = services["neo4j"]["environment"]
          forbidden = {"NEO4J_USER", "NEO4J_PASSWORD"} & set(neo4j_environment)
          if forbidden:
              raise SystemExit(
                  "Neo4j container received unsupported strict-config variables: "
                  + ", ".join(sorted(forbidden))
              )
          if "NEO4J_AUTH" not in neo4j_environment:
              raise SystemExit("Neo4j container is missing NEO4J_AUTH.")

          api_environment = services["api"]["environment"]
          required_api = {"NEO4J_URI", "NEO4J_USER", "NEO4J_PASSWORD"}
          missing_api = required_api - set(api_environment)
          if missing_api:
              raise SystemExit(
                  "API container is missing Neo4j client variables: "
                  + ", ".join(sorted(missing_api))
              )

      - name: Start stack and run health checks
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker compose --env-file .env.ci logs --no-color --tail=200 || true
            docker compose --env-file .env.ci down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose --env-file .env.ci up --detach --build --wait --wait-timeout 300
          # The runtime intentionally starts in degraded mode when Neo4j is late or down.
          # CI is stricter: once every service is healthy, rebuild the projection and
          # require its watermark to match the active PostgreSQL publication.
          docker compose --env-file .env.ci exec --no-TTY api python -m app.cli seed-mock
          curl --fail --show-error --silent http://127.0.0.1:8000/api/v1/health \
            | python -c 'import json, sys; payload = json.load(sys.stdin); assert payload["graph_status"] == "healthy", payload; assert payload["graph_publication_id"] == payload["publication_id"], payload'
          curl --fail --show-error --silent http://127.0.0.1:8080/healthz >/dev/null

  publish:
    name: Publish and sign ${{ matrix.component }} image
    if: github.event_name == 'push'
    needs:
      - compose-smoke
      - container-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: deploy/docker/backend.Dockerfile
            image: ghcr.io/begop/regontology-api
          - component: web
            dockerfile: deploy/docker/frontend.Dockerfile
            image: ghcr.io/begop/regontology-web
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v7.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            VITE_API_BASE_URL=/api/v1
            VITE_DEMO_MODE=false
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image digest with GitHub OIDC
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
