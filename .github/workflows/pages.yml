name: GitHub Pages mock UI

on:
  workflow_run:
    workflows:
      - CI and container release
    types:
      - completed

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy public mock UI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"

      - name: Enable pinned pnpm
        working-directory: frontend
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm typecheck

      - name: Component tests
        working-directory: frontend
        run: pnpm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build API-independent mock UI
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_BASE_PATH: /RegOntology/
          VITE_DEMO_MODE: "true"
          VITE_PAGES_BUILD: "true"
        run: pnpm build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
